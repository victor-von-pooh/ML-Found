[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-found"
version = "0.1.0"
description = "PyTorch のモデルを config から自動で学習させる基盤モジュール"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "omegaconf>=2.3",
    "torch>=2.2",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "pytest"
]
examples = [
    "scikit-learn"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
