# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: cartpole
  seed: 42
  device: cpu

optimizer:
  name: Adam
  params:
    lr: 0.01

trainer:
  epochs: 30
  # 検証の評価のエピソードの報酬の和が大きいほど良い
  monitor: valid/reward
  mode: max

# プロジェクト固有の設定, 項目は自由に追加可能
env:
  id: CartPole-v1
  valid_seed: 10000

rollout:
  episodes: 20
  batch_episodes: 5
  gamma: 0.99
  temperature: 1.0
  epsilon: 0.0
  safety_key: cost

evaluation:
  episodes: 10

loss:
  entropy_coef: 0.01

model:
  hidden_dim: 64

# 書き出す方策の止める条件 (台車の位置と棒の角度. CartPole が終わる範囲)
guards:
  position_limit: 2.4
  angle_limit: 0.2095
