name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # CUDA の無い軽い PyTorch を先に入れてから, パッケージとテストの依存を入れる
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # 強化学習の CartPole のテストのため, 追加の依存 rl も入れる
      - run: pip install -e ".[dev,examples,rl]"
      - run: pytest -q

  # CLAUDE.md の一覧に無いリポジトリの名前が, 管理下のファイルに無いことの確認
  repo-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/check_repo_names.py
